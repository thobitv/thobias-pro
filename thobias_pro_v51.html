<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thobias Pro | v61</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0f1e">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0a0f1e;--bg2:#111827;--card:#151d2e;--card2:#1c2640;--text:#e8edf5;--text2:#8b95a8;--text3:#5a6478;--accent:#34d399;--accent-glow:rgba(52,211,153,.12);--blue:#60a5fa;--orange:#fb923c;--red:#f87171;--purple:#a78bfa;--pink:#f472b6;--yellow:#fbbf24;--border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);--radius:14px}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
        body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overscroll-behavior:none}
        .app{max-width:520px;margin:0 auto;padding:12px 12px 170px 12px}
        .hdr{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--border2);border-radius:20px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
        .hdr::before{content:'';position:absolute;top:-50%;right:-30%;width:200px;height:200px;background:radial-gradient(circle,rgba(52,211,153,.08),transparent 70%);pointer-events:none}
        .hdr-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
        .brand{font-size:18px;font-weight:900;letter-spacing:-.5px;color:var(--accent);text-transform:uppercase}
        .brand-sub{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text3);margin-top:2px}
        .score-ring{width:64px;height:64px;position:relative}
        .score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
        .score-ring circle{fill:none;stroke-width:4}
        .score-ring .bg{stroke:var(--bg)}
        .score-ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
        .score-val{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:800;color:var(--accent)}
        .water{margin-top:14px;background:rgba(0,0,0,.25);border-radius:12px;padding:12px;border:1px solid var(--border)}
        .water-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
        .water-label{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.5px}
        .water-val{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600}
        .water-detail{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
        .water-chip{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px}
        .water-bar{height:6px;background:var(--bg);border-radius:3px;display:flex;overflow:hidden;margin-bottom:8px}
        .wb-w{background:var(--blue);height:100%;transition:width .3s}
        .wb-c{background:var(--orange);height:100%;transition:width .3s}
        .wb-o{background:var(--purple);height:100%;transition:width .3s}
        .water-btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
        .wbtn{padding:8px 4px;border-radius:10px;border:1px solid;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;transition:transform .1s}
        .wbtn:active{transform:scale(.96)}
        .wbtn-w{border-color:rgba(96,165,250,.3);color:var(--blue);background:rgba(96,165,250,.08)}
        .wbtn-c{border-color:rgba(251,146,60,.3);color:var(--orange);background:rgba(251,146,60,.08)}
        .wbtn-o{border-color:rgba(167,139,250,.3);color:var(--purple);background:rgba(167,139,250,.08)}
        .wbtn-undo{border-color:rgba(248,113,113,.25);color:var(--red);background:rgba(248,113,113,.06);font-size:8px;padding:6px 4px}
        .tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:4px;margin-bottom:14px;position:sticky;top:0;z-index:50}
        .tab{padding:10px 6px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);background:transparent;cursor:pointer;transition:all .25s}
        .tab.active{background:var(--accent);color:#0a0f1e}
        .tab-icon{font-size:14px;display:block;margin-bottom:2px}
        .panel{display:none}.panel.active{display:block}
        .time-sep{position:sticky;top:56px;z-index:20;background:rgba(10,15,30,.92);backdrop-filter:blur(8px);padding:8px 0;margin:14px 0 6px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px}
        .time-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
        .task{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:6px;display:flex;align-items:center;gap:10px;transition:all .2s;cursor:pointer}
        .task:active{transform:scale(.99)}
        .task.done{background:var(--accent-glow);border-color:rgba(52,211,153,.25)}
        .task.suspended{opacity:.35;border-style:dashed}
        .task.dragging{opacity:.25;transform:scale(.98)}
        .task.drag-over{border-color:var(--accent)!important;background:rgba(52,211,153,.1)!important}
        .ex-card.dragging{opacity:.25}
        .ex-card.drag-over{border-color:var(--accent)!important;background:rgba(52,211,153,.1)!important}
        .drag-handle{width:20px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:16px;cursor:grab;opacity:.35;flex-shrink:0;touch-action:none;user-select:none;-webkit-user-select:none}
        .drag-handle:active{cursor:grabbing;opacity:.8}
        .chk{width:28px;height:28px;min-width:28px;border-radius:8px;border:2px solid var(--text3);display:flex;align-items:center;justify-content:center;transition:.2s;font-size:14px;color:transparent}
        .task.done .chk{background:var(--accent);border-color:var(--accent);color:#0a0f1e}
        .task-info{flex:1;min-width:0}
        .task-meta{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--yellow);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
        .task-title{font-size:12.5px;font-weight:500;line-height:1.35;color:var(--text)}
        .task.suspended .task-title{text-decoration:line-through;color:var(--text3)}
        .task-log{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;background:var(--accent);color:#0a0f1e;padding:2px 6px;border-radius:4px;margin-top:3px}
        .task-note{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--text3);line-height:1.4;margin-top:4px;padding:4px 6px;background:rgba(255,255,255,.03);border-radius:6px;border-left:2px solid var(--border2)}
        .task-btns{display:flex;gap:2px}
        .task-edit,.task-chart{background:none;border:none;color:var(--text3);padding:5px;cursor:pointer;opacity:.4;font-size:13px}
        .task-edit:hover,.task-chart:hover{opacity:1;color:var(--text)}
        .ex-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:6px}
        .ex-name{font-weight:700;font-size:13px;color:var(--text);margin-bottom:6px}
        .ex-sets{display:flex;flex-wrap:wrap;gap:4px}
        .ex-set{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 8px;color:var(--text2);cursor:pointer}
        .ex-set.done{background:var(--accent-glow);border-color:rgba(52,211,153,.3);color:var(--accent)}
        .ex-meta{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3);margin-top:6px}
        .add-btn{width:100%;padding:14px;margin-top:10px;background:transparent;border:1px dashed var(--border2);border-radius:var(--radius);color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;text-transform:uppercase;cursor:pointer;transition:.2s}
        .add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}
        .bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(10,15,30,.95);border-top:1px solid var(--border);padding:12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;backdrop-filter:blur(10px);z-index:100}
        .bar-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:10px 6px;border-radius:12px;font-family:'Outfit',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
        .bar-btn.primary{background:var(--accent);color:#0a0f1e;border:none}
        .bar-btn.cam{background:var(--yellow);color:#0a0f1e;border:none}
        .bar-btn svg{width:16px;height:16px}
        .modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);z-index:2000;display:none;align-items:center;justify-content:center;padding:16px}
        .modal-bg.open{display:flex}
        .modal{background:var(--card);width:100%;max-width:420px;border-radius:18px;border:1px solid var(--border2);padding:20px;max-height:90vh;overflow-y:auto}
        .modal h3{font-size:15px;font-weight:800;margin-bottom:16px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
        .fld{margin-bottom:12px}
        .fld label{display:block;font-size:9px;font-weight:700;text-transform:uppercase;color:var(--text3);margin-bottom:4px;letter-spacing:.5px}
        .fld input,.fld select,.fld textarea{width:100%;background:var(--bg);border:1px solid var(--border2);color:var(--text);padding:10px 12px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:15px}
        .fld textarea{resize:vertical;min-height:60px}
        .modal-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
        .mbtn{flex:1;padding:11px;border-radius:10px;border:none;font-family:'Outfit',sans-serif;font-weight:700;font-size:12px;cursor:pointer;min-width:70px;text-transform:uppercase}
        .mbtn-save{background:var(--accent);color:#0a0f1e;flex:2}
        .mbtn-close{background:var(--text3);color:var(--bg)}
        .mbtn-del{background:var(--red);color:white}
        .mbtn-sus{background:var(--orange);color:#0a0f1e}
        .chart-wrap{padding:10px 0}
        .chart-title{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;margin-bottom:8px;letter-spacing:.5px}
        .chart-subtitle{font-size:10px;color:var(--text3);margin-bottom:10px}
        .chart-canvas{width:100%;background:var(--bg);border-radius:12px;border:1px solid var(--border)}
        .chart-empty{text-align:center;padding:30px;color:var(--text3);font-size:11px}
        .chart-legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
        .chart-legend-item{font-family:'JetBrains Mono',monospace;font-size:9px;display:flex;align-items:center;gap:4px}
        .chart-legend-dot{width:8px;height:8px;border-radius:2px}
        .hist-item{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
        .hist-date{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text2)}
        .hist-score{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:800;color:var(--accent)}
        .hist-water{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--blue)}
        canvas{display:none}
    </style>
</head>
<body>
<div class="app">
    <div class="hdr">
        <div class="hdr-top">
            <div>
                <div class="brand">Thobias Pro</div>
                <div class="brand-sub" id="displayDate">--/--/----</div>
                <div class="brand-sub" style="color:var(--text3);opacity:.5">v61</div>
            </div>
            <div class="score-ring">
                <svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.5"/><circle class="fg" id="scoreArc" cx="18" cy="18" r="15.5" stroke-dasharray="97.4" stroke-dashoffset="97.4"/></svg>
                <div class="score-val"><span id="lblScore">0</span>%</div>
            </div>
        </div>
        <div class="water">
            <div class="water-top">
                <span class="water-label">Hidratação (Meta: 4L)</span>
                <span class="water-val" style="color:var(--blue)"><span id="lblWater">0</span> ml</span>
            </div>
            <div class="water-detail">
                <span class="water-chip" style="color:var(--blue);background:rgba(96,165,250,.1)">💧 <span id="lblPure">0</span></span>
                <span class="water-chip" style="color:var(--orange);background:rgba(251,146,60,.1)">☕ <span id="lblDecaf">0</span></span>
                <span class="water-chip" style="color:var(--purple);background:rgba(167,139,250,.1)">🥤 <span id="lblOther">0</span></span>
            </div>
            <div class="water-bar">
                <div class="wb-w" id="barW" style="width:0%"></div>
                <div class="wb-c" id="barC" style="width:0%"></div>
                <div class="wb-o" id="barO" style="width:0%"></div>
            </div>
            <div class="water-btns">
                <button class="wbtn wbtn-w" onclick="addFluid('pure',250)">💧+250</button>
                <button class="wbtn wbtn-c" onclick="addFluid('decaf',200)">☕+200</button>
                <button class="wbtn wbtn-o" onclick="addFluid('other',250)">🥤+250</button>
            </div>
            <div class="water-btns" style="margin-top:6px">
                <button class="wbtn wbtn-undo" onclick="undoFluid('pure',250)">💧−250</button>
                <button class="wbtn wbtn-undo" onclick="undoFluid('decaf',200)">☕−200</button>
                <button class="wbtn wbtn-undo" onclick="undoFluid('other',250)">🥤−250</button>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('supps')"><span class="tab-icon">💊</span>Suplem.</button>
        <button class="tab" onclick="switchTab('derm')"><span class="tab-icon">🧴</span>Derma</button>
        <button class="tab" onclick="switchTab('gym')"><span class="tab-icon">🏋️</span>Treino</button>
        <button class="tab" onclick="switchTab('food')"><span class="tab-icon">🍽</span>Aliment.</button>
    </div>

    <div id="panel-supps" class="panel active"></div>
    <div id="panel-derm" class="panel"></div>
    <div id="panel-gym" class="panel">
        <div style="display:flex;gap:8px;margin-bottom:10px">
            <button class="add-btn" onclick="openWorkoutTimer()" style="flex:1;margin:0;background:rgba(52,211,153,.1);border-color:var(--accent);color:var(--accent)">⏱ Cronômetro Musculação</button>
        </div>
        <div style="margin-bottom:10px">
            <div style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">📋 Carregar Treino Prescrito</div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
                <button class="wbtn" onclick="loadPreset('A')" style="padding:10px 4px;border-color:rgba(248,113,113,.3);color:var(--red);background:rgba(248,113,113,.06);font-size:8.5px;flex-direction:column;gap:2px"><span style="font-size:13px">🏋️</span>Peitoral<br>Definição</button>
                <button class="wbtn" onclick="loadPreset('B')" style="padding:10px 4px;border-color:rgba(96,165,250,.3);color:var(--blue);background:rgba(96,165,250,.06);font-size:8.5px;flex-direction:column;gap:2px"><span style="font-size:13px">🔵</span>Dorsal<br>Bíceps</button>
                <button class="wbtn" onclick="loadPreset('C')" style="padding:10px 4px;border-color:rgba(167,139,250,.3);color:var(--purple);background:rgba(167,139,250,.06);font-size:8.5px;flex-direction:column;gap:2px"><span style="font-size:13px">🦵</span>Inferiores<br>Core</button>
            </div>
        </div>
        <div id="exList"></div>
        <button class="add-btn" onclick="openExModal('new')">+ Adicionar Exercício</button>
    </div>
    <div id="panel-food" class="panel">
        <div id="macroBar" style="display:flex;justify-content:space-around;padding:10px 0;font-family:'JetBrains Mono',monospace;font-size:10px;border-bottom:1px solid var(--border2);margin-bottom:10px">
            <div style="text-align:center"><div style="color:var(--text3)">Kcal</div><div id="fTotalKcal" style="font-size:16px;font-weight:800;color:var(--accent)">0</div></div>
            <div style="text-align:center"><div style="color:var(--red)">Prot</div><div id="fTotalProt" style="font-size:16px;font-weight:800;color:var(--red)">0g</div></div>
            <div style="text-align:center"><div style="color:var(--blue)">Carb</div><div id="fTotalCarb" style="font-size:16px;font-weight:800;color:var(--blue)">0g</div></div>
            <div style="text-align:center"><div style="color:var(--yellow)">Gord</div><div id="fTotalFat" style="font-size:16px;font-weight:800;color:var(--yellow)">0g</div></div>
            <div style="text-align:center"><div style="color:var(--purple)">Fibra</div><div id="fTotalFib" style="font-size:16px;font-weight:800;color:var(--purple)">0g</div></div>
        </div>
        <div id="foodList"></div>
        <button class="add-btn" onclick="openFoodModal('new')">+ Adicionar Alimento</button>
    </div>
    <button class="add-btn" id="addSuppBtn" onclick="openEdit('new','supps')">+ Adicionar Suplemento</button>
    <button class="add-btn" id="addDermBtn" onclick="openEdit('new','derm')" style="display:none">+ Adicionar Cuidado</button>
</div>

<div class="bar">
    <button class="bar-btn" onclick="openHistory()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>Histórico</button>
    <button class="bar-btn cam" onclick="generateSnapshot()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>Imagem</button>
    <button class="bar-btn primary" onclick="finishDay()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>Encerrar</button>
</div>

<!-- FOOD MODAL -->
<div id="foodModal" class="modal-bg"><div class="modal">
    <h3 id="foodModalTitle">Alimento</h3><input type="hidden" id="foodEditId">
    <div class="fld"><label>Alimento</label>
        <select id="foodSelect" onchange="onFoodSelect()" style="width:100%;padding:10px;border-radius:8px;background:var(--card);color:var(--text);border:1px solid var(--border2);font-size:13px">
            <option value="">— Selecionar —</option>
        </select>
    </div>
    <div class="fld"><label>Nome (ou personalizado)</label><input type="text" id="foodName"></div>
    <div class="fld"><label>Porção consumida (g ou ml)</label><input type="number" id="foodQty" value="100" min="1" step="1" onchange="calcFoodMacros()" oninput="calcFoodMacros()"></div>
    <div id="foodMacroPreview" style="font-family:'JetBrains Mono',monospace;font-size:11px;padding:8px;background:rgba(255,255,255,.03);border-radius:8px;margin-bottom:10px"></div>
    <div class="fld"><label>Refeição</label>
        <select id="foodMeal" style="width:100%;padding:10px;border-radius:8px;background:var(--card);color:var(--text);border:1px solid var(--border2);font-size:13px">
            <option value="cafe">☕ Café da manhã</option>
            <option value="lanche_m">🍎 Lanche manhã</option>
            <option value="almoco" selected>🍽 Almoço</option>
            <option value="lanche_t">🥜 Lanche tarde</option>
            <option value="pre_treino">💪 Pré-treino</option>
            <option value="pos_treino">🥤 Pós-treino</option>
            <option value="jantar">🌙 Jantar</option>
            <option value="ceia">🍫 Ceia</option>
        </select>
    </div>
    <div class="fld"><label>Notas</label><textarea id="foodNotes" placeholder="Observações..."></textarea></div>
    <div class="modal-row">
        <button class="mbtn mbtn-del" id="foodDelBtn" onclick="deleteFood()" style="display:none">Excluir</button>
        <button class="mbtn mbtn-close" onclick="closeModal('foodModal')">Cancelar</button>
        <button class="mbtn mbtn-save" onclick="saveFood()">Salvar</button>
    </div>
</div></div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal-bg"><div class="modal">
    <h3 id="editModalTitle">Editar</h3>
    <input type="hidden" id="editId"><input type="hidden" id="editPanel">
    <div class="fld"><label>Nome</label><input type="text" id="editTitle"></div>
    <div class="fld"><label>Horário Agendado</label><input type="time" id="editTime"></div>
    <div class="fld" id="fldLog"><label>Horário Realizado</label><input type="time" id="editLog"></div>
    <div class="fld"><label>Dose</label><input type="text" id="editQty"></div>

// ═══ STATE ═══
let state={
  supps:[],derm:[],gym:[],food:[],
  fluids:{pure:0,decaf:0,other:0},
  history:[],gymHistory:[],date:'',
  userMods:{
    supps:{suspended:{},deleted:[],added:[]},
    derm:{suspended:{},deleted:[],added:[]}
  }
};
const SK='thobias_v51';

// ═══ USER MODS (persistência de customizações entre dias) ═══
function ensureUserMods(){
  if(!state.userMods) state.userMods={supps:{suspended:{},deleted:[],added:[]},derm:{suspended:{},deleted:[],added:[]}};
  ['supps','derm'].forEach(p=>{
    if(!state.userMods[p]) state.userMods[p]={suspended:{},deleted:[],added:[]};
    if(!state.userMods[p].suspended) state.userMods[p].suspended={};
    if(!state.userMods[p].deleted) state.userMods[p].deleted=[];
    if(!state.userMods[p].added) state.userMods[p].added=[];
  });
}

function applyUserMods(panel){
  ensureUserMods();
  const mods=state.userMods[panel];
  // Remover itens deletados
  state[panel]=state[panel].filter(t=>!mods.deleted.includes(t.id));
  // Aplicar estados de suspensão
  state[panel].forEach(t=>{
    if(mods.suspended[t.id]!==undefined) t.suspended=mods.suspended[t.id];
  });
  // Adicionar itens criados pelo usuário (com done/log zerados)
  if(mods.added&&mods.added.length){
    const fresh=JSON.parse(JSON.stringify(mods.added)).map(t=>({...t,done:false,log:''}));
    state[panel].push(...fresh);
  }
  state[panel].sort((a,b)=>a.time.localeCompare(b.time));
}

function initDay(dateStr){
  const dow=new Date().getDay();
  const isIron=[1,3,5].includes(dow);
  const isTuesday=dow===2;
  state.supps=JSON.parse(JSON.stringify(SUPPS));
  state.derm=JSON.parse(JSON.stringify(DERM));
  applyUserMods('supps');
  applyUserMods('derm');
  state.supps.forEach(t=>{
    if(t.ironOnly) t.suspended=!isIron;
    if(t.tuesdayOnly) t.suspended=!isTuesday;
  });
  state.fluids={pure:0,decaf:0,other:0};
  state.food=[];
  state.gym=[];
  state.date=dateStr;
}

function load(){
  const r=localStorage.getItem(SK);
  if(r) state=JSON.parse(r);
  if(!state.fluids) state.fluids={pure:0,decaf:0,other:0};
  if(state.fluids.other==null) state.fluids.other=0;
  if(!state.supps) state.supps=[];
  if(!state.derm) state.derm=[];
  if(!state.gym) state.gym=[];
  if(!state.food) state.food=[];
  if(!state.history) state.history=[];
  if(!state.gymHistory) state.gymHistory=[];
  ensureUserMods();

  const today=new Date().toLocaleDateString('pt-BR');

  if(!state.date){
    initDay(today);
    save();
  } else if(state.date!==today){
    // Marcar como pendente de rollover — modal será exibido após DOM pronto
    if(!state._rollover) state._rollover={oldDate:state.date,today};
    // NÃO reseta ainda — aguarda decisão do usuário
  } else {
    // Mesmo dia — garantir listas populadas com SUPPS atual
    if(!state.supps.length){
      state.supps=JSON.parse(JSON.stringify(SUPPS));
      applyUserMods('supps');
    }
    if(!state.derm.length){
      state.derm=JSON.parse(JSON.stringify(DERM));
      applyUserMods('derm');
    }
    // Garantir novos itens do protocolo que não estavam no save anterior
    const existingIds=new Set(state.supps.map(t=>t.id));
    SUPPS.forEach(t=>{
      if(!existingIds.has(t.id)&&!state.userMods.supps.deleted.includes(t.id)){
        const fresh={...JSON.parse(JSON.stringify(t)),done:false,log:''};
        if(state.userMods.supps.suspended[t.id]!==undefined) fresh.suspended=state.userMods.supps.suspended[t.id];
        state.supps.push(fresh);
      }
    });
    state.supps.sort((a,b)=>a.time.localeCompare(b.time));
    save();
  }
}

function save(){localStorage.setItem(SK,JSON.stringify(state));render();}

// ═══ ROLLOVER ═══
function showRolloverModal(){
  if(!state._rollover) return;
  const {oldDate,today}=state._rollover;
  const hasData=state.supps.some(t=>t.done)||state.derm.some(t=>t.done)||state.gym.length>0||(state.fluids.pure+state.fluids.decaf+state.fluids.other)>0;
  if(!hasData){
    // Nada para salvar — resetar direto
    delete state._rollover;
    initDay(today);
    save();
    return;
  }
  document.getElementById('rolloverMsg').textContent=`O dia ${oldDate} não foi encerrado. Deseja salvar os dados antes de iniciar ${today}?`;
  document.getElementById('rolloverModal').classList.add('open');
}

function rolloverSnapshot(){
  generateSnapshot();
}

function rolloverFinalize(){
  if(!state._rollover) return;
  const {oldDate,today}=state._rollover;
  _saveToHistory(oldDate);
  delete state._rollover;
  initDay(today);
  save();
  closeModal('rolloverModal');
}

function rolloverDiscard(){
  if(!state._rollover) return;
  const {today}=state._rollover;
  delete state._rollover;
  initDay(today);
  save();
  closeModal('rolloverModal');
}

function _saveToHistory(dateStr){
  const allActive=[...state.supps,...state.derm].filter(t=>!t.suspended);
  const done=allActive.filter(t=>t.done).length;
  const score=Math.round((done/(allActive.length||1))*100);
  const itemLogs={};
  [...state.supps,...state.derm].forEach(t=>{
    if(!t.suspended) itemLogs[t.id]={done:!!t.done,log:t.log||null,title:t.title,time:t.time};
  });
  if(state.history.length>0&&state.history[0].date===dateStr) state.history.shift();
  state.history.unshift({date:dateStr,score,water:state.fluids.pure+state.fluids.decaf+state.fluids.other,gym:state.gym.length,items:itemLogs,autoSaved:false});
  if(state.history.length>90) state.history.pop();
  state.gym.forEach(ex=>{
    const key=ex.name.trim().toLowerCase();
    if(!state.gymHistory) state.gymHistory=[];
    if(ex.type==='cardio'){
      state.gymHistory.push({date:dateStr,name:ex.name,key,type:'cardio',duration:ex.duration,calories:ex.calories,distance:ex.distance,hr:ex.hr,done:ex.done});
    } else {
      state.gymHistory.push({date:dateStr,name:ex.name,key,type:'resistido',series:ex.series,reps:ex.reps,load:ex.load,rest:ex.rest,group:ex.group,completed:ex.completed||[]});
    }
  });
  if(state.gymHistory.length>500) state.gymHistory=state.gymHistory.slice(-500);
}

// ═══ TABS ═══
let activeTab='supps';
function switchTab(t){
  activeTab=t;
  document.querySelectorAll('.tab').forEach((el,i)=>el.classList.toggle('active',['supps','derm','gym','food'][i]===t));
  document.querySelectorAll('.panel').forEach(el=>el.classList.remove('active'));

  document.getElementById('addSuppBtn').style.display=t==='supps'?'':'none';
  document.getElementById('addDermBtn').style.display=t==='derm'?'':'none';
}

// ═══ ACTIONS ═══
function toggleTask(p,id){const t=state[p].find(x=>x.id===id);if(t&&!t.suspended){t.done=!t.done;t.log=t.done?new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';save();}}
function addFluid(t,a){state.fluids[t]+=a;save();}
function undoFluid(t,a){state.fluids[t]=Math.max(0,state.fluids[t]-a);save();}

// ═══ EDIT MODAL ═══
function openEdit(id,panel){
  const isNew=id==='new';
  const t=isNew?{id:'new',time:'08:00',qty:'',title:'',cat:'Extra',log:'',suspended:false,userNote:''}:state[panel].find(x=>x.id===id);
  if(!t) return;
  document.getElementById('editId').value=t.id;
  document.getElementById('editPanel').value=panel;
  document.getElementById('editTitle').value=t.title;
  document.getElementById('editTime').value=t.time.match(/^\d{2}:\d{2}$/)?t.time:'08:00';
  document.getElementById('editLog').value=t.log||'';
  document.getElementById('editQty').value=t.qty;
  document.getElementById('editCat').value=t.cat||'';
  document.getElementById('editNotes').value=t.userNote||'';
  document.getElementById('editModalTitle').textContent=isNew?'Novo Item':'Editar Item';
  document.getElementById('editRow1').style.display=isNew?'none':'flex';
  document.getElementById('fldLog').style.display=isNew?'none':'block';
  if(!isNew){const b=document.getElementById('btnSus');b.textContent=t.suspended?'Reativar':'Suspender';b.style.background=t.suspended?'var(--accent)':'var(--orange)';}
  document.getElementById('editModal').classList.add('open');
}

function saveEdit(){
  const id=document.getElementById('editId').value,panel=document.getElementById('editPanel').value,title=document.getElementById('editTitle').value;
  if(!title) return alert('Nome obrigatório');
  const d={title,qty:document.getElementById('editQty').value,time:document.getElementById('editTime').value||'08:00',cat:document.getElementById('editCat').value||'Extra',userNote:document.getElementById('editNotes').value||''};
  if(id==='new'){
    const newItem={...d,id:'c'+Date.now(),done:false,log:'',suspended:false};
    state[panel].push(newItem);
    state[panel].sort((a,b)=>a.time.localeCompare(b.time));
    // Persistir em userMods para sobreviver ao rollover
    ensureUserMods();
    state.userMods[panel].added.push(JSON.parse(JSON.stringify(newItem)));
  } else {
    const t=state[panel].find(x=>x.id===id);
    if(t){
      Object.assign(t,d);
      const lv=document.getElementById('editLog').value;
      if(lv&&!t.done){t.done=true;t.log=lv;}else if(lv){t.log=lv;}
      state[panel].sort((a,b)=>a.time.localeCompare(b.time));
      // Se é item adicionado pelo usuário, atualizar também no userMods
      ensureUserMods();
      const idx=state.userMods[panel].added.findIndex(x=>x.id===id);
      if(idx>-1) state.userMods[panel].added[idx]={...state.userMods[panel].added[idx],...d};
    }
  }
  save();closeModal('editModal');
}

function deleteItem(){
  const id=document.getElementById('editId').value,p=document.getElementById('editPanel').value;
  if(confirm('Excluir este item permanentemente?')){
    state[p]=state[p].filter(x=>x.id!==id);
    ensureUserMods();
    // Itens built-in: marcar como deletado
    if(!id.startsWith('c')){
      if(!state.userMods[p].deleted.includes(id)) state.userMods[p].deleted.push(id);
    } else {
      // Itens adicionados pelo usuário: remover do added
      state.userMods[p].added=state.userMods[p].added.filter(x=>x.id!==id);
    }
    save();closeModal('editModal');
  }
}

function toggleSuspend(){
  const id=document.getElementById('editId').value,p=document.getElementById('editPanel').value,t=state[p].find(x=>x.id===id);
  if(t){
    t.suspended=!t.suspended;
    if(t.suspended){t.done=false;t.log='';}
    // Persistir suspensão
    ensureUserMods();
    state.userMods[p].suspended[id]=t.suspended;
    // Atualizar também em added se aplicável
    const addedItem=state.userMods[p].added.find(x=>x.id===id);
    if(addedItem) addedItem.suspended=t.suspended;
    save();closeModal('editModal');
  }
}

function duplicateItem(){
  const id=document.getElementById('editId').value;
  const p=document.getElementById('editPanel').value;
  const orig=state[p].find(x=>x.id===id);
  if(!orig) return;
  closeModal('editModal');
  // Pré-preencher modal com cópia
  document.getElementById('editId').value='new';
  document.getElementById('editPanel').value=p;
  document.getElementById('editTitle').value='Cópia de '+orig.title;
  document.getElementById('editTime').value=orig.time.match(/^\d{2}:\d{2}$/)?orig.time:'08:00';
  document.getElementById('editLog').value='';
  document.getElementById('editQty').value=orig.qty;
  document.getElementById('editCat').value=orig.cat||'';

// ═══ DRAG & DROP ═══
let dd={panel:null,fromId:null,fromEl:null,clone:null,oy:0};

function ddStart(e,panel,id){
  e.preventDefault();e.stopPropagation();
  const touch=e.touches[0];
  dd.panel=panel;dd.fromId=id;
  dd.fromEl=e.currentTarget.closest('.task,.ex-card');
  if(!dd.fromEl) return;
  const rect=dd.fromEl.getBoundingClientRect();
  dd.oy=touch.clientY-rect.top;
  dd.fromEl.classList.add('dragging');
  dd.clone=dd.fromEl.cloneNode(true);
  dd.clone.style.cssText=`position:fixed;z-index:9999;opacity:.88;pointer-events:none;width:${rect.width}px;left:${rect.left}px;top:${rect.top}px;transform:rotate(1.5deg) scale(1.02);box-shadow:0 12px 40px rgba(0,0,0,.7);border-radius:14px;transition:none`;
  document.body.appendChild(dd.clone);
}

function ddMove(e){
  if(!dd.fromId) return;
  e.preventDefault();
  const touch=e.touches[0];
  dd.clone.style.top=(touch.clientY-dd.oy)+'px';
  dd.clone.style.display='none';
  const el=document.elementFromPoint(touch.clientX,touch.clientY);
  dd.clone.style.display='';
  document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
  const card=el?.closest('[data-ddid]');
  if(card&&card.dataset.ddid!==dd.fromId) card.classList.add('drag-over');
}

function ddEnd(e){
  if(!dd.fromId) return;
  const touch=e.changedTouches[0];
  if(dd.clone) dd.clone.style.display='none';
  const el=document.elementFromPoint(touch.clientX,touch.clientY);
  const card=el?.closest('[data-ddid]');
  if(card&&card.dataset.ddid&&card.dataset.ddid!==dd.fromId){
    const arr=dd.panel==='gym'?state.gym:state[dd.panel];
    const fi=arr.findIndex(x=>x.id===dd.fromId);
    const ti=arr.findIndex(x=>x.id===card.dataset.ddid);
    if(fi!==-1&&ti!==-1){const[item]=arr.splice(fi,1);arr.splice(ti,0,item);save();}
  }
  if(dd.fromEl) dd.fromEl.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));
  if(dd.clone){dd.clone.remove();dd.clone=null;}
  dd={panel:null,fromId:null,fromEl:null,clone:null,oy:0};
}

document.addEventListener('touchmove',ddMove,{passive:false});
document.addEventListener('touchend',ddEnd);

function toggleExSet(eid,si){
  const ex=state.gym.find(x=>x.id===eid);

  if(i>-1){ex.completed.splice(i,1);}

// ═══ ITEM PROGRESS CHART ═══
function openItemChart(id,panel){
  const item=state[panel].find(x=>x.id===id);
  if(!item) return;
  document.getElementById('chartTitle').textContent=item.title;
  const container=document.getElementById('chartContent');
  const data=[];
  const hist=[...state.history].reverse();
  hist.forEach(h=>{if(h.items&&h.items[id]) data.push({date:h.date,done:h.items[id].done,log:h.items[id].log,scheduled:h.items[id].time||item.time});});
  if(data.length<2){container.innerHTML='<div class="chart-empty">Mínimo 2 dias de histórico para gerar gráfico.<br>Encerre o dia para salvar dados.</div>';document.getElementById('chartModal').classList.add('open');return;}
  function timeToMin(t){if(!t) return null;const[h,m]=t.split(':').map(Number);return h*60+(m||0);}
  const labels=data.map(d=>d.date.substring(0,5));
  const scheduled=timeToMin(data[0].scheduled);
  const values=data.map(d=>d.done?timeToMin(d.log):null);
  const validTimes=values.filter(v=>v!==null);
  const avgTime=validTimes.length?Math.round(validTimes.reduce((a,b)=>a+b,0)/validTimes.length):null;
  const compliance=Math.round((validTimes.length/data.length)*100);
  function minToStr(m){if(m==null) return '--';return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
  let html=`<div class="chart-subtitle">Aderência: <strong style="color:var(--accent)">${compliance}%</strong> (${validTimes.length}/${data.length} dias) · Horário médio: <strong style="color:var(--blue)">${minToStr(avgTime)}</strong> · Agendado: ${minToStr(scheduled)}</div>`;
  html+=`<canvas id="itemChartCvs" class="chart-canvas" width="400" height="200" style="display:block;width:100%;height:200px"></canvas>`;
  html+=`<div class="chart-legend"><div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--blue)"></div>Realizado</div><div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--red);opacity:.4"></div>Agendado</div><div class="chart-legend-item"><div class="chart-legend-dot" style="background:var(--text3)"></div>Não tomou</div></div>`;
  container.innerHTML=html;document.getElementById('chartModal').classList.add('open');
  requestAnimationFrame(()=>{
    const cvs=document.getElementById('itemChartCvs');const ctx=cvs.getContext('2d');const dpr=window.devicePixelRatio||1;cvs.width=cvs.offsetWidth*dpr;cvs.height=200*dpr;ctx.scale(dpr,dpr);const W=cvs.offsetWidth,H=200;const pad={t:20,r:15,b:30,l:40};const cw=W-pad.l-pad.r,ch=H-pad.t-pad.b;
    const allVals=[...validTimes,scheduled].filter(v=>v!=null);let yMin=Math.min(...allVals)-30;let yMax=Math.max(...allVals)+30;if(yMax-yMin<60){yMin-=30;yMax+=30;}
    function xPos(i){return pad.l+i*(cw/(labels.length-1||1));}function yPos(v){return pad.t+ch-(((v-yMin)/(yMax-yMin))*ch);}
    ctx.strokeStyle='rgba(255,255,255,.05)';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=pad.t+i*(ch/4);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.fillStyle='#5a6478';ctx.font='9px JetBrains Mono';ctx.textAlign='right';ctx.fillText(minToStr(Math.round(yMax-(i/4)*(yMax-yMin))),pad.l-4,y+3);}
    ctx.textAlign='center';ctx.fillStyle='#5a6478';ctx.font='8px JetBrains Mono';const step=Math.max(1,Math.floor(labels.length/8));labels.forEach((l,i)=>{if(i%step===0||i===labels.length-1) ctx.fillText(l,xPos(i),H-6);});
    if(scheduled!=null){ctx.strokeStyle='rgba(248,113,113,.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(pad.l,yPos(scheduled));ctx.lineTo(W-pad.r,yPos(scheduled));ctx.stroke();ctx.setLineDash([]);}
    ctx.strokeStyle='#60a5fa';ctx.lineWidth=2;ctx.beginPath();let started=false;values.forEach((v,i)=>{if(v!==null){if(!started){ctx.moveTo(xPos(i),yPos(v));started=true;}else ctx.lineTo(xPos(i),yPos(v));}});ctx.stroke();
    values.forEach((v,i)=>{ctx.beginPath();if(v!==null){ctx.fillStyle='#60a5fa';ctx.arc(xPos(i),yPos(v),3,0,Math.PI*2);}else{ctx.fillStyle='#5a6478';ctx.arc(xPos(i),yPos(scheduled||yMin),3,0,Math.PI*2);}ctx.fill();});
  });
}

let wkTimer={running:false,start:0,elapsed:0,interval:null,subMode:'idle',subStart:0,subElapsed:0,subInterval:null,totalSeriesTime:0,totalRestTime:0,seriesCount:0,restCount:0,activeExId:null,activeSetIdx:-1};
function fmtTimer(ms){const s=Math.floor(ms/1000),m=Math.floor(s/60),h=Math.floor(m/60);return(h?String(h).padStart(2,'0')+':':'')+String(m%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function openWorkoutTimer(){renderTimerUI();document.getElementById('timerModal').classList.add('open');document.getElementById('btnMinimize').style.display='';}
function closeTimerModal(){if(wkTimer.running||wkTimer.elapsed>0){minimizeTimer();}else{stopWorkoutTimer();closeModal('timerModal');}}
function minimizeTimer(){closeModal('timerModal');document.getElementById('timerPip').style.display='block';renderPip();}
function expandTimer(){document.getElementById('timerPip').style.display='none';renderTimerUI();document.getElementById('timerModal').classList.add('open');document.getElementById('btnMinimize').style.display='';}
function closePip(){stopWorkoutTimer();document.getElementById('timerPip').style.display='none';}
function renderPip(){
  const pip=document.getElementById('timerPip');if(!pip||pip.style.display==='none') return;
  const elapsed=wkTimer.running?(wkTimer.elapsed+Date.now()-wkTimer.start):wkTimer.elapsed;
  const subElapsed=(wkTimer.subMode!=='idle'&&wkTimer.subInterval)?(wkTimer.subElapsed+Date.now()-wkTimer.subStart):wkTimer.subElapsed;
  const mainEl=document.getElementById('pipMain');const subEl=document.getElementById('pipSub');const ppBtn=document.getElementById('pipPlayPause');const subBtn=document.getElementById('pipSubBtn');
  if(!mainEl) return;
  mainEl.textContent=fmtTimer(elapsed);mainEl.style.color=wkTimer.running?'var(--accent)':'var(--text2)';
  ppBtn.textContent=wkTimer.running?'⏸':'▶';ppBtn.style.background=wkTimer.running?'var(--accent)':'var(--blue)';
  if(wkTimer.subMode==='idle'){subEl.textContent='—';subEl.style.color='var(--text3)';subBtn.textContent='🏋️ Série';subBtn.style.color='var(--accent)';subBtn.style.borderColor='rgba(52,211,153,.4)';}
  else if(wkTimer.subMode==='series'){subEl.textContent='🏋️ SÉRIE '+fmtTimer(subElapsed);subEl.style.color='var(--accent)';subBtn.textContent='✓ Fim série';subBtn.style.color='var(--accent)';}
  else{subEl.textContent='⏳ INTERVALO '+fmtTimer(subElapsed);subEl.style.color='var(--orange)';subBtn.textContent='✓ Fim intervalo';subBtn.style.color='var(--orange)';}
}
function pipTogglePlay(){if(wkTimer.elapsed===0&&!wkTimer.running){startWorkoutTimer();return;}if(wkTimer.running) pauseWorkoutTimer();else resumeWorkoutTimer();}
function pipSubAction(){if(wkTimer.subMode==='idle') startSub('series');else endSub();}
(function initPipDrag(){let drag=false,ox=0,oy=0;function getEl(){return document.getElementById('timerPip');}function start(e){if(e.target.tagName==='BUTTON') return;drag=true;const el=getEl(),r=el.getBoundingClientRect();const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;ox=cx-r.left;oy=cy-r.top;el.style.cursor='grabbing';e.preventDefault();}function move(e){if(!drag) return;const el=getEl();const cx=e.touches?e.touches[0].clientX:e.clientX;const cy=e.touches?e.touches[0].clientY:e.clientY;let nx=cx-ox,ny=cy-oy;nx=Math.max(0,Math.min(nx,window.innerWidth-el.offsetWidth));ny=Math.max(0,Math.min(ny,window.innerHeight-el.offsetHeight));el.style.right='auto';el.style.bottom='auto';el.style.left=nx+'px';el.style.top=ny+'px';e.preventDefault();}function end(){drag=false;const el=getEl();if(el) el.style.cursor='grab';}document.addEventListener('DOMContentLoaded',function(){const el=getEl();if(!el) return;el.addEventListener('mousedown',start);el.addEventListener('touchstart',start,{passive:false});document.addEventListener('mousemove',move);document.addEventListener('touchmove',move,{passive:false});document.addEventListener('mouseup',end);document.addEventListener('touchend',end);});})();
function adjustTimer(ms){if(wkTimer.running){wkTimer.elapsed+=Date.now()-wkTimer.start;wkTimer.start=Date.now();}wkTimer.elapsed=Math.max(0,wkTimer.elapsed+ms);renderTimerUI();renderPip();}
function adjustSub(ms){if(wkTimer.subInterval){wkTimer.subElapsed+=Date.now()-wkTimer.subStart;wkTimer.subStart=Date.now();}const before=wkTimer.subElapsed;wkTimer.subElapsed=Math.max(0,wkTimer.subElapsed+ms);const delta=wkTimer.subElapsed-before;if(wkTimer.subMode==='series') wkTimer.totalRestTime=Math.max(0,wkTimer.totalRestTime-delta);else if(wkTimer.subMode==='rest') wkTimer.totalSeriesTime=Math.max(0,wkTimer.totalSeriesTime-delta);renderTimerUI();renderPip();}
function adjustSeriesCount(delta){wkTimer.seriesCount=Math.max(0,wkTimer.seriesCount+delta);renderTimerUI();renderPip();}
function renderTimerUI(){
  const el=document.getElementById('timerContent');
  const elapsed=wkTimer.running?(wkTimer.elapsed+Date.now()-wkTimer.start):wkTimer.elapsed;
  const subElapsed=(wkTimer.subMode!=='idle'&&wkTimer.subInterval)?(wkTimer.subElapsed+Date.now()-wkTimer.subStart):wkTimer.subElapsed;
  const adjBtnStyle='background:rgba(255,255,255,.07);border:1px solid var(--border2);color:var(--text2);border-radius:8px;padding:6px 10px;font-family:JetBrains Mono,monospace;font-size:11px;font-weight:700;cursor:pointer';
  let html=`<div style="text-align:center;margin:16px 0"><div style="font-family:'JetBrains Mono',monospace;font-size:42px;font-weight:800;color:${wkTimer.running?'var(--accent)':'var(--text2)'}">${fmtTimer(elapsed)}</div><div style="font-size:10px;color:var(--text3);margin-top:4px">TEMPO TOTAL DO TREINO</div><div style="display:flex;gap:6px;justify-content:center;margin-top:8px"><button style="${adjBtnStyle}" onclick="adjustTimer(-30000)">−30s</button><button style="${adjBtnStyle}" onclick="adjustTimer(-5000)">−5s</button><button style="${adjBtnStyle}" onclick="adjustTimer(5000)">+5s</button><button style="${adjBtnStyle}" onclick="adjustTimer(30000)">+30s</button></div></div>`;
  html+=`<div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">`;
  if(!wkTimer.running&&wkTimer.elapsed===0){html+=`<button class="mbtn mbtn-save" onclick="startWorkoutTimer()" style="flex:1">▶ Iniciar Treino</button>`;}
  else if(wkTimer.running){html+=`<button class="mbtn mbtn-del" onclick="pauseWorkoutTimer()" style="flex:1">⏸ Pausar</button>`;}
  else{html+=`<button class="mbtn mbtn-save" onclick="resumeWorkoutTimer()" style="flex:1">▶ Retomar</button><button class="mbtn mbtn-del" onclick="finishWorkoutTimer()" style="flex:1">⏹ Finalizar</button>`;}
  html+=`</div>`;
  if(wkTimer.running||wkTimer.elapsed>0){
    const subColor=wkTimer.subMode==='series'?'var(--accent)':wkTimer.subMode==='rest'?'var(--orange)':'var(--text3)';
    const subLabel=wkTimer.subMode==='series'?'🏋️ SÉRIE':wkTimer.subMode==='rest'?'⏳ INTERVALO':'—';
    html+=`<div style="border-top:1px solid var(--border2);padding-top:14px;margin-top:8px"><div style="text-align:center;margin-bottom:10px"><div style="font-size:10px;font-weight:700;color:${subColor};text-transform:uppercase;margin-bottom:4px">${subLabel}</div><div style="font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:800;color:${subColor}">${fmtTimer(wkTimer.subMode!=='idle'&&wkTimer.subInterval?subElapsed:0)}</div></div><div style="display:flex;gap:8px;justify-content:center;margin-bottom:12px">`;
    if(wkTimer.subMode==='idle'){html+=`<button class="mbtn" onclick="startSub('series')" style="flex:1;background:rgba(52,211,153,.15);color:var(--accent);border:1px solid var(--accent)">🏋️ Iniciar Série</button>`;}
    else if(wkTimer.subMode==='series'){html+=`<button class="mbtn" onclick="endSub()" style="flex:1;background:rgba(52,211,153,.15);color:var(--accent);border:1px solid var(--accent)">✓ Fim da Série</button>`;}
    else if(wkTimer.subMode==='rest'){html+=`<button class="mbtn" onclick="endSub()" style="flex:1;background:rgba(251,146,60,.15);color:var(--orange);border:1px solid var(--orange)">✓ Fim do Intervalo</button>`;}
    html+=`</div>`;
    if(wkTimer.subMode!=='idle'){html+=`<div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px"><button style="${adjBtnStyle}" onclick="adjustSub(-5000)">−5s</button><button style="${adjBtnStyle}" onclick="adjustSub(5000)">+5s</button></div>`;}
    html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:'JetBrains Mono',monospace;font-size:10px"><div style="background:rgba(52,211,153,.06);padding:8px;border-radius:8px;text-align:center"><div style="color:var(--accent);font-weight:800;font-size:16px">${fmtTimer(wkTimer.totalSeriesTime)}</div><div style="color:var(--text3);margin:3px 0">Sob tensão</div><div style="display:flex;align-items:center;justify-content:center;gap:6px"><button style="${adjBtnStyle};padding:3px 8px" onclick="adjustSeriesCount(-1)">−</button><span style="color:var(--accent);font-weight:800">${wkTimer.seriesCount} séries</span><button style="${adjBtnStyle};padding:3px 8px" onclick="adjustSeriesCount(1)">+</button></div></div><div style="background:rgba(251,146,60,.06);padding:8px;border-radius:8px;text-align:center"><div style="color:var(--orange);font-weight:800;font-size:16px">${fmtTimer(wkTimer.totalRestTime)}</div><div style="color:var(--text3)">Intervalo (${wkTimer.restCount}x)</div></div></div></div>`;
  }
  el.innerHTML=html;
}
function startWorkoutTimer(){wkTimer.running=true;wkTimer.start=Date.now();wkTimer.elapsed=0;wkTimer.totalSeriesTime=0;wkTimer.totalRestTime=0;wkTimer.seriesCount=0;wkTimer.restCount=0;wkTimer.subMode='idle';wkTimer.interval=setInterval(function(){renderTimerUI();renderPip();},500);renderTimerUI();renderPip();}
function pauseWorkoutTimer(){wkTimer.running=false;wkTimer.elapsed+=Date.now()-wkTimer.start;clearInterval(wkTimer.interval);wkTimer.interval=null;if(wkTimer.subMode!=='idle') pauseSub();renderTimerUI();renderPip();}
function resumeWorkoutTimer(){wkTimer.running=true;wkTimer.start=Date.now();wkTimer.interval=setInterval(function(){renderTimerUI();renderPip();},500);renderTimerUI();renderPip();}
function stopWorkoutTimer(){if(wkTimer.interval){clearInterval(wkTimer.interval);wkTimer.interval=null;}if(wkTimer.subInterval){clearInterval(wkTimer.subInterval);wkTimer.subInterval=null;}}
function finishWorkoutTimer(){
  const totalMs=wkTimer.elapsed;if(wkTimer.subMode!=='idle') endSub();
  clearInterval(wkTimer.interval);wkTimer.interval=null;
  const totalMin=Math.round(totalMs/60000),seriesMin=(wkTimer.totalSeriesTime/60000).toFixed(1),restMin=(wkTimer.totalRestTime/60000).toFixed(1);
  const cals=prompt('Calorias estimadas (smartwatch):','0');
  const notes=`⏱ ${totalMin}min total · 🏋️ ${seriesMin}min tensão (${wkTimer.seriesCount} séries) · ⏳ ${restMin}min intervalo (${wkTimer.restCount}x)`;
  state.gym.push({id:'ex'+Date.now(),name:'Musculação',type:'cardio',duration:totalMin,calories:parseInt(cals)||0,distance:'',hr:0,notes,done:true,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),isGeneric:true,seriesTime:wkTimer.totalSeriesTime,restTime:wkTimer.totalRestTime,seriesCount:wkTimer.seriesCount,restCount:wkTimer.restCount});
  wkTimer={running:false,start:0,elapsed:0,interval:null,subMode:'idle',subStart:0,subElapsed:0,subInterval:null,totalSeriesTime:0,totalRestTime:0,seriesCount:0,restCount:0};
  save();closeModal('timerModal');
}
function startSub(mode){wkTimer.subMode=mode;wkTimer.subStart=Date.now();wkTimer.subElapsed=0;wkTimer.subInterval=setInterval(function(){renderTimerUI();renderPip();},200);renderTimerUI();renderPip();}
function pauseSub(){if(wkTimer.subInterval){wkTimer.subElapsed+=Date.now()-wkTimer.subStart;clearInterval(wkTimer.subInterval);wkTimer.subInterval=null;}}
function endSub(){
  const elapsed=wkTimer.subElapsed+(wkTimer.subInterval?Date.now()-wkTimer.subStart:0);
  if(wkTimer.subMode==='series'){wkTimer.totalSeriesTime+=elapsed;wkTimer.seriesCount++;wkTimer.subMode='rest';}
  else if(wkTimer.subMode==='rest'){wkTimer.totalRestTime+=elapsed;wkTimer.restCount++;wkTimer.subMode='idle';}
  if(wkTimer.subInterval){clearInterval(wkTimer.subInterval);wkTimer.subInterval=null;}
  wkTimer.subElapsed=0;wkTimer.subStart=Date.now();
  if(wkTimer.subMode==='rest'){startSub('rest');}else{renderTimerUI();}
}

function generateSnapshot(){
  const c=document.getElementById('snapCanvas'),ctx=c.getContext('2d'),w=1080;
  const allActive=[...state.supps,...state.derm].filter(t=>!t.suspended);
  const h=400+allActive.length*55+state.gym.length*55+100;c.height=h;
  ctx.fillStyle='#0a0f1e';ctx.fillRect(0,0,w,h);ctx.fillStyle='#151d2e';ctx.fillRect(0,0,w,300);
  ctx.fillStyle='#34d399';ctx.font='bold 52px sans-serif';ctx.fillText('THOBIAS PRO — RELATÓRIO',50,90);
  ctx.fillStyle='#8b95a8';ctx.font='34px sans-serif';ctx.fillText(state.date,50,150);
  const done=allActive.filter(t=>t.done).length;const score=Math.round((done/(allActive.length||1))*100);
  ctx.fillStyle='#e8edf5';ctx.font='bold 72px sans-serif';ctx.fillText(score+'%',850,140);
  ctx.fillStyle='#60a5fa';ctx.font='bold 34px sans-serif';ctx.fillText('💧 '+(state.fluids.pure+state.fluids.decaf+state.fluids.other)+'ml',50,230);
  ctx.fillStyle='#fb923c';ctx.font='28px sans-serif';ctx.fillText('🏋️ '+state.gym.length+' exercícios',50,275);
  let y=360;ctx.font='24px sans-serif';
  allActive.forEach(t=>{ctx.fillStyle=t.done?'#34d399':'#1a2235';ctx.fillRect(50,y-28,32,32);ctx.fillStyle=t.done?'#8b95a8':'#e8edf5';ctx.fillText(t.time+' — '+t.title,100,y);if(t.done&&t.log){ctx.fillStyle='#34d399';ctx.fillText(t.log,950,y);}y+=55;});
  if(state.gym.length){y+=20;ctx.fillStyle='#fbbf24';ctx.font='bold 28px sans-serif';ctx.fillText('TREINO DO DIA',50,y);y+=40;ctx.font='24px sans-serif';state.gym.forEach(ex=>{ctx.fillStyle='#e8edf5';ctx.fillText(ex.name+(ex.reps?' — '+ex.reps+' reps @ '+ex.load+'kg':''),100,y);y+=55;});}
  c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Relatorio_'+state.date.replace(/\//g,'-')+'.png';a.click();});
}

        <div class="task-btns">
          <button class="task-chart" onclick="event.stopPropagation();openItemChart('${t.id}','${panel}')" title="Progresso">📊</button>
          <button class="task-edit" onclick="event.stopPropagation();openEdit('${t.id}','${panel}')" title="Editar">⚙️</button>
        </div>`;
      el.appendChild(row);
    });
  });
}

function renderGym(){
  const el=document.getElementById('exList');el.innerHTML='';
  if(!state.gym.length){el.innerHTML='<p style="color:var(--text3);font-size:12px;text-align:center;padding:30px">Nenhum exercício registrado hoje.<br>Toque + para adicionar.</p>';return;}
  state.gym.forEach(ex=>{
    const card=document.createElement('div');card.className='ex-card';card.setAttribute('data-ddid',ex.id);
    if(ex.type==='cardio'){
      const doneClass=ex.done?' done':'';
      card.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
        <div class="drag-handle" ontouchstart="ddStart(event,'gym','${ex.id}')" style="margin-right:4px">⠿</div>
        <div class="ex-name" style="flex:1">🫀 ${ex.name}</div>
        <div class="task-btns">
          <button class="task-chart" onclick="openExHistory('${ex.id}')" title="Histórico">📊</button>
          <button class="task-edit" onclick="openExModal('${ex.id}')" title="Editar">⚙️</button>
        </div>
      </div>
      <div class="ex-sets"><div class="ex-set${doneClass}" onclick="toggleCardioDone('${ex.id}')" style="min-width:100%">⏱ ${ex.duration}min${ex.calories?' · 🔥 '+ex.calories+'kcal':''}${ex.distance?' · 📏 '+ex.distance+'km':''}${ex.hr?' · ❤️ '+ex.hr+'bpm':''}</div></div>
      ${ex.notes?`<div class="ex-meta">📝 ${ex.notes}</div>`:''}`;
    } else {
      let sH='';const rA=ex.reps?ex.reps.split(',').map(s=>s.trim()):[];const lA=ex.load?ex.load.split(',').map(s=>s.trim()):[];
      for(let i=0;i<ex.series;i++){const done=ex.completed&&ex.completed.includes(i);const r=rA[i]||rA[rA.length-1]||'?';const l=lA[i]||lA[lA.length-1]||'?';sH+=`<div class="ex-set${done?' done':''}" onclick="toggleExSet('${ex.id}',${i})">S${i+1}: ${r}×${l}kg</div>`;}
      card.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center">
        <div class="drag-handle" ontouchstart="ddStart(event,'gym','${ex.id}')" style="margin-right:4px">⠿</div>
        <div class="ex-name" style="flex:1">${ex.name}</div>
        <div class="task-btns">
          <button class="task-chart" onclick="openExHistory('${ex.id}')" title="Histórico">📊</button>
          <button class="task-edit" onclick="openExModal('${ex.id}')" title="Editar">⚙️</button>
        </div>
      </div>
      ${ex.group?`<div class="ex-meta" style="color:var(--purple);margin-bottom:6px">${ex.group}</div>`:''}
      <div class="ex-sets">${sH}</div>
      <div class="ex-meta">⏱ ${ex.rest}s${ex.notes?' · '+ex.notes:''}</div>`;
    }
    el.appendChild(card);
  });
}

// ═══ FOOD ═══
function populateFoodSelect(){const sel=document.getElementById('foodSelect');sel.innerHTML='<option value="">— Selecionar do banco —</option>';let lastCat='';FOODS.forEach(f=>{if(f.cat!==lastCat){const og=document.createElement('optgroup');og.label=f.cat;sel.appendChild(og);lastCat=f.cat;}const opt=document.createElement('option');opt.value=f.fid;opt.textContent=`${f.name} (${f.defQty}${f.unit})`;sel.lastElementChild.appendChild(opt);});}
function onFoodSelect(){const fid=document.getElementById('foodSelect').value;const f=FOODS.find(x=>x.fid===fid);if(f){document.getElementById('foodName').value=f.name;document.getElementById('foodQty').value=f.defQty;calcFoodMacros();}}
function calcFoodMacros(){const fid=document.getElementById('foodSelect').value;const f=FOODS.find(x=>x.fid===fid);const qty=parseFloat(document.getElementById('foodQty').value)||0;const el=document.getElementById('foodMacroPreview');if(!f){el.innerHTML='<span style="color:var(--text3)">Selecione um alimento para ver os macros</span>';return;}const m=qty/100;const kcal=Math.round(f.per100.kcal*m);const prot=(f.per100.prot*m).toFixed(1);const carb=(f.per100.carb*m).toFixed(1);const fat=(f.per100.fat*m).toFixed(1);const fib=(f.per100.fib*m).toFixed(1);el.innerHTML=`<div style="display:flex;justify-content:space-around;text-align:center"><div><span style="color:var(--accent);font-weight:800;font-size:14px">${kcal}</span><br><span style="font-size:8px;color:var(--text3)">kcal</span></div><div><span style="color:var(--red);font-weight:800">${prot}g</span><br><span style="font-size:8px;color:var(--text3)">prot</span></div><div><span style="color:var(--blue);font-weight:800">${carb}g</span><br><span style="font-size:8px;color:var(--text3)">carb</span></div><div><span style="color:var(--yellow);font-weight:800">${fat}g</span><br><span style="font-size:8px;color:var(--text3)">gord</span></div><div><span style="color:var(--purple);font-weight:800">${fib}g</span><br><span style="font-size:8px;color:var(--text3)">fibra</span></div></div>`;}
function openFoodModal(id){const isNew=id==='new';document.getElementById('foodEditId').value=id;document.getElementById('foodModalTitle').textContent=isNew?'Adicionar Alimento':'Editar Alimento';document.getElementById('foodDelBtn').style.display=isNew?'none':'block';populateFoodSelect();document.getElementById('foodSelect').value='';document.getElementById('foodName').value='';document.getElementById('foodQty').value=100;document.getElementById('foodMeal').value='almoco';document.getElementById('foodNotes').value='';document.getElementById('foodMacroPreview').innerHTML='<span style="color:var(--text3)">Selecione um alimento para ver os macros</span>';if(!isNew){const item=state.food.find(x=>x.id===id);if(item){document.getElementById('foodSelect').value=item.fid||'';document.getElementById('foodName').value=item.name;document.getElementById('foodQty').value=item.qty;document.getElementById('foodMeal').value=item.meal||'almoco';document.getElementById('foodNotes').value=item.notes||'';calcFoodMacros();}}document.getElementById('foodModal').classList.add('open');}
function saveFood(){const id=document.getElementById('foodEditId').value;const name=document.getElementById('foodName').value;if(!name) return alert('Nome obrigatório');const fid=document.getElementById('foodSelect').value;const f=FOODS.find(x=>x.fid===fid);const qty=parseFloat(document.getElementById('foodQty').value)||0;const meal=document.getElementById('foodMeal').value;const notes=document.getElementById('foodNotes').value;const m=qty/100;const macros=f?{kcal:Math.round(f.per100.kcal*m),prot:+(f.per100.prot*m).toFixed(1),carb:+(f.per100.carb*m).toFixed(1),fat:+(f.per100.fat*m).toFixed(1),fib:+(f.per100.fib*m).toFixed(1)}:{kcal:0,prot:0,carb:0,fat:0,fib:0};const unit=f?f.unit:'g';const d={name,fid:fid||'',qty,unit,meal,notes,macros,eaten:true,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};if(id==='new'){state.food.push({...d,id:'fd'+Date.now()});}else{const item=state.food.find(x=>x.id===id);if(item) Object.assign(item,d);}save();closeModal('foodModal');}
function deleteFood(){const id=document.getElementById('foodEditId').value;if(confirm('Excluir?')){state.food=state.food.filter(x=>x.id!==id);save();closeModal('foodModal');}}
function toggleFoodEaten(id){const item=state.food.find(x=>x.id===id);if(item){item.eaten=!item.eaten;save();}}
const MEAL_LABELS={cafe:'☕ Café',lanche_m:'🍎 Lanche M',almoco:'🍽 Almoço',lanche_t:'🥜 Lanche T',pre_treino:'💪 Pré-treino',pos_treino:'🥤 Pós-treino',jantar:'🌙 Jantar',ceia:'🍫 Ceia'};
const MEAL_ORDER=['cafe','lanche_m','almoco','lanche_t','pre_treino','pos_treino','jantar','ceia'];
function renderFood(){
  const el=document.getElementById('foodList');el.innerHTML='';
  if(!state.food.length){el.innerHTML='<p style="color:var(--text3);font-size:12px;text-align:center;padding:30px">Nenhum alimento registrado hoje.<br>Toque + para adicionar.</p>';updateFoodTotals();return;}
  const groups={};state.food.forEach(item=>{const m=item.meal||'almoco';if(!groups[m]) groups[m]=[];groups[m].push(item);});
  MEAL_ORDER.forEach(meal=>{
    if(!groups[meal]) return;
    let sk=0,sp=0,sc=0,sf=0,sfb=0;groups[meal].filter(f=>f.eaten).forEach(f=>{const m=f.macros||{};sk+=m.kcal||0;sp+=m.prot||0;sc+=m.carb||0;sf+=m.fat||0;sfb+=m.fib||0;});
    const header=document.createElement('div');header.style.cssText='display:flex;justify-content:space-between;align-items:baseline;padding:8px 0 4px;border-bottom:1px solid var(--border2);margin-bottom:6px;margin-top:8px';
    header.innerHTML=`<span style="font-size:11px;font-weight:700;color:var(--text3)">${MEAL_LABELS[meal]||meal}</span><span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3)">${Math.round(sk)}kcal · <span style="color:var(--red)">${sp.toFixed(0)}P</span> · <span style="color:var(--blue)">${sc.toFixed(0)}C</span> · <span style="color:var(--yellow)">${sf.toFixed(0)}G</span></span>`;
    el.appendChild(header);
    groups[meal].forEach(item=>{
      const card=document.createElement('div');card.className='ex-card';card.style.opacity=item.eaten?'1':'0.4';const mc=item.macros||{kcal:0,prot:0,carb:0,fat:0,fib:0};
      card.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:center;gap:8px;flex:1;cursor:pointer" onclick="toggleFoodEaten('${item.id}')"><div style="width:22px;height:22px;border-radius:50%;border:2px solid ${item.eaten?'var(--accent)':'var(--border2)'};display:flex;align-items:center;justify-content:center;flex-shrink:0">${item.eaten?'<div style="width:12px;height:12px;border-radius:50%;background:var(--accent)"></div>':''}</div><div><div class="ex-name" style="font-size:12px">${item.name}</div><div style="font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text3)">${item.qty}${item.unit} · ${mc.kcal}kcal · <span style="color:var(--red)">${mc.prot}P</span> · <span style="color:var(--blue)">${mc.carb}C</span> · <span style="color:var(--yellow)">${mc.fat}G</span> · <span style="color:var(--purple)">${mc.fib}F</span></div></div></div><button class="task-edit" onclick="openFoodModal('${item.id}')" title="Editar">⚙️</button></div>${item.notes?'<div style="font-size:9px;color:var(--text3);margin-top:4px;padding-left:30px">📝 '+item.notes+'</div>':''}`;
      el.appendChild(card);
    });
  });
  updateFoodTotals();
}
function updateFoodTotals(){let kcal=0,prot=0,carb=0,fat=0,fib=0;state.food.filter(f=>f.eaten).forEach(f=>{const m=f.macros||{};kcal+=m.kcal||0;prot+=m.prot||0;carb+=m.carb||0;fat+=m.fat||0;fib+=m.fib||0;});document.getElementById('fTotalKcal').textContent=Math.round(kcal);document.getElementById('fTotalProt').textContent=prot.toFixed(1)+'g';document.getElementById('fTotalCarb').textContent=carb.toFixed(1)+'g';document.getElementById('fTotalFat').textContent=fat.toFixed(1)+'g';document.getElementById('fTotalFib').textContent=fib.toFixed(1)+'g';}

function render(){
  document.getElementById('displayDate').textContent=state.date;
  const allActive=[...state.supps,...state.derm].filter(t=>!t.suspended);
  const done=allActive.filter(t=>t.done).length;
  const score=Math.round((done/(allActive.length||1))*100);
  document.getElementById('lblScore').textContent=score;
  const circ=2*Math.PI*15.5;
  document.getElementById('scoreArc').setAttribute('stroke-dashoffset',circ-(circ*score/100));
  const fp=state.fluids.pure||0,fd=state.fluids.decaf||0,fo=state.fluids.other||0,totalW=fp+fd+fo;
  document.getElementById('lblWater').textContent=totalW;
  document.getElementById('lblPure').textContent=fp;
  document.getElementById('lblDecaf').textContent=fd;
  document.getElementById('lblOther').textContent=fo;
  document.getElementById('barW').style.width=Math.min((fp/4000)*100,100)+'%';
  document.getElementById('barC').style.width=Math.min((fd/4000)*100,100)+'%';
  document.getElementById('barO').style.width=Math.min((fo/4000)*100,100)+'%';
  renderList('supps','panel-supps');
  renderList('derm','panel-derm');
  renderGym();
  renderFood();
}

function loadPreset(key){
  const preset=WORKOUT_PRESETS[key];if(!preset) return;
  if(state.gym.length>0&&!confirm(`Substituir os ${state.gym.length} exercício(s) atuais pelo treino "${preset.name}"?`)) return;
  state.gym=preset.exercises.map(ex=>({...ex,id:'ex'+Date.now()+Math.random().toString(36).substr(2,5),completed:[],done:false,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}));
  save();switchTab('gym');
}
